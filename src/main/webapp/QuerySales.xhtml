<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core"
	xmlns:p="primefaces">
	<f:view locale="#{index.locale}">
		<h:head>
			<meta charset="UTF-8"/>
			<title>#{msg['MainGUI.QuerySales']}</title>
		</h:head>
		<h:body>
			<h:form id="queryForm">
				<h2>#{msg['QuerySalesGUI.FindProducts']}</h2>
				<p:inputText value="#{querysales.desc}"/>
				<p:commandButton value="#{msg['QuerySalesGUI.Search']}" action="#{querysales.searchSales}" update="tabla mensajes"/>
				<p:messages id="mensajes"/>
				<p:dataTable id="tabla" value="#{querysales.sales}" var="s" emptyMessage="">
					<p:column headerText="#{msg['CreateSaleGUI.Title']}">
						<h:outputText value="#{s.title}"/>
					</p:column>
					<p:column headerText="#{msg['CreateSaleGUI.Price']}">
						<h:outputText value="#{s.price}"/>
					</p:column>
					<p:column headerText="#{msg['CreateSaleGUI.PublicationDate']}">
						<h:outputText value="#{s.publicationDate}">
							<f:convertDateTime pattern="dd/MM/yyyy"/>
						</h:outputText>
					</p:column>
				</p:dataTable>
				<p>
					<h:link value="#{msg['Close']}" outcome="index"/>
				</p>
			</h:form>
		</h:body>
	</f:view>
</html>
